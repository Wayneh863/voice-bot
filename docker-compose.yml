version: "3.8"

services:
  voice-bot:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=1
    volumes:
      - ./:/app  # Hot reload in dev
    restart: unless-stopped

  # Optional: ngrok tunnel for local testing
  # Uncomment and add your ngrok authtoken
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   command: http voice-bot:3000 --authtoken=${NGROK_AUTHTOKEN}
  #   ports:
  #     - "4040:4040"  # ngrok web UI
  #   depends_on:
  #     - voice-bot
  #   environment:
  #     - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}